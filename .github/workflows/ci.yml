name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - 'feature/*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      - name: Python Code Format Check
        run: |
          black --check app tests

      - name: Python Flake8 Lint Check
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        run: |
          pytest -v

  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Container (Validation Dry-Run)
        run: |
          docker build -t rolex-price-api:ci-test -f Dockerfile .

  terraform-validate:
    name: Terraform Format & Plan Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916923735465:role/OIDC_SAAS
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Dev Init
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform Dev Format Check
        run: terraform fmt -check

      - name: Terraform Dev Validate
        run: terraform validate

      - name: Terraform Dev Plan Check
        run: terraform plan -var="enable_app_services=false"
