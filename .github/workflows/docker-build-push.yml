name: Docker Build, Push & Endpoint Validation

on:
  workflow_run:
    workflows: ["Terraform Dev Apply"]
    types:
      - completed
    branches:
      - 'develop'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rolex-price-api-dev
  IMAGE_TAG: latest

jobs:
  build-push-validate:
    name: Build, Push & Validate Container
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1b: Set up Python environment & execute unit test suite
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Run Pytest Suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          pytest

      # Step 2: Configure AWS Credentials using GitHub OIDC
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916923735465:role/OIDC_SAAS
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      # Step 2b: Verify ECR Repository Exists (Terraform/ECR Validation)
      - name: Verify ECR Repository Exists
        run: |
          echo "Validating target ECR repository '${{ env.ECR_REPOSITORY }}' exists..."
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Set image variables
      - name: Set Image URI Variable
        id: image-info
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      # Step 5: Build Docker Image
      - name: Build Docker Image
        run: |
          echo "Building Docker image: ${{ env.IMAGE_URI }}"
          docker build -t ${{ env.IMAGE_URI }} -f Dockerfile .

      # Step 6: Push Docker Image to ECR
      - name: Push Docker Image to ECR
        run: |
          echo "Pushing Docker image to ECR..."
          docker push ${{ env.IMAGE_URI }}

      # Step 7: Verify Image exists in ECR
      - name: Verify Image in ECR
        run: |
          echo "Verifying image in Amazon ECR..."
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --region ${{ env.AWS_REGION }}

      # Step 8: Run Container locally inside GitHub runner & Validate Endpoints
      - name: Validate Container Endpoints Locally
        run: |
          echo "Starting Docker container locally for health & endpoint verification..."
          docker run -d --name rolex-api-test -p 8000:8000 ${{ env.IMAGE_URI }}

          echo "Waiting for container application startup..."
          MAX_RETRIES=15
          COUNT=0
          until curl -s -f http://localhost:8000/health > /dev/null || [ $COUNT -eq $MAX_RETRIES ]; do
            echo "Waiting for service to respond on port 8000... ($COUNT/$MAX_RETRIES)"
            sleep 2
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "ERROR: Container failed to start or respond to /health in time."
            docker logs rolex-api-test
            docker stop rolex-api-test && docker rm rolex-api-test
            exit 1
          fi

          echo "=================================================="
          echo "EXECUTING ENDPOINT VALIDATION TESTS"
          echo "=================================================="

          FAILED=0

          test_endpoint() {
            ENDPOINT="$1"
            EXPECTED_CODE="$2"

            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" "http://localhost:8000${ENDPOINT}")
            echo -n "Testing GET ${ENDPOINT} ... "

            if [ "$HTTP_CODE" -eq "$EXPECTED_CODE" ]; then
              echo "SUCCESS (HTTP $HTTP_CODE)"
              head -n 5 /tmp/response.json || true
              echo ""
            else
              echo "FAILED (Expected HTTP $EXPECTED_CODE, Got HTTP $HTTP_CODE)"
              cat /tmp/response.json || true
              echo ""
              FAILED=$((FAILED + 1))
            fi
          }

          test_endpoint "/health" 200
          test_endpoint "/watches" 200
          test_endpoint "/collections" 200
          test_endpoint "/statistics" 200

          echo "=================================================="
          docker stop rolex-api-test && docker rm rolex-api-test

          if [ $FAILED -ne 0 ]; then
            echo "ERROR: $FAILED endpoint validation test(s) failed."
            exit 1
          else
            echo "SUCCESS: All endpoint validation tests passed cleanly."
          fi

      # Step 8b: Update AWS Lambda Function with new container image URI
      - name: Update Lambda Function Image
        run: |
          echo "Updating AWS Lambda function 'rolex-price-api-dev-app' with new image: ${{ env.IMAGE_URI }}"
          aws lambda update-function-code \
            --function-name rolex-price-api-dev-app \
            --image-uri ${{ env.IMAGE_URI }} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for Lambda function code update to complete..."
          aws lambda wait function-updated \
            --function-name rolex-price-api-dev-app \
            --region ${{ env.AWS_REGION }}

      # Step 8c: Run Cloud Smoke Tests against API Gateway
      - name: Run Cloud Smoke Tests
        run: |
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='rolex-price-api-dev-http-api'].ApiId" --output text --region ${{ env.AWS_REGION }})
          if [ -z "$API_ID" ] || [ "$API_ID" == "None" ]; then
            echo "WARNING: Could not find API Gateway HTTP API 'rolex-price-api-dev-http-api'. Skipping live cloud smoke tests."
            exit 0
          fi

          API_ENDPOINT="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com"
          echo "Target API Gateway Endpoint: $API_ENDPOINT"

          test_endpoint() {
            ENDPOINT="$1"
            URL="${API_ENDPOINT}${ENDPOINT}"
            echo -n "Testing GET ${URL} ... "
            HTTP_CODE=$(curl -s -o /tmp/cloud_resp.json -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "SUCCESS (HTTP 200)"
              head -n 5 /tmp/cloud_resp.json || true
              echo ""
            else
              echo "FAILED (HTTP $HTTP_CODE)"
              cat /tmp/cloud_resp.json || true
              echo ""
              exit 1
            fi
          }

          test_endpoint "/health"
          test_endpoint "/watches"
          test_endpoint "/collections"
          test_endpoint "/statistics"

          echo "All live cloud smoke tests passed successfully (HTTP 200)."

      # Step 9: Output Build & Deployment Summary
      - name: Output Summary
        if: always()
        run: |
          echo "### 🚀 ECR Build & Endpoint Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Image URI**: \`${{ env.IMAGE_URI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target ECR Repository**: \`${{ env.ECR_REPOSITORY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Endpoint Validation Checklist" >> $GITHUB_STEP_SUMMARY
          echo "- [x] \`GET /health\` (HTTP 200)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] \`GET /watches\` (HTTP 200)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] \`GET /collections\` (HTTP 200)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] \`GET /statistics\` (HTTP 200)" >> $GITHUB_STEP_SUMMARY
