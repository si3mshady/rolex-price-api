name: Terraform Dev Apply

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/*'
      - 'develop'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rolex-price-api-dev
  IMAGE_TAG: latest

jobs:
  terraform-dev-apply:
    name: Terraform Dev Apply & Deployment Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916923735465:role/OIDC_SAAS
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Print Terraform Version
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM VERSION ==="
          terraform version

      # Step 1: Terraform Bootstrap Infrastructure (S3 Remote State Bucket & DynamoDB Lock Table)
      - name: Terraform Bootstrap Apply
        run: |
          set -euo pipefail
          echo "=== TERRAFORM BOOTSTRAP APPLY ==="
          cd ../../bootstrap
          terraform init
          terraform fmt -check
          terraform validate
          terraform apply -auto-approve

      - name: Terraform Dev Init
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM DEV INIT ==="
          terraform init -backend-config=backend.tfvars

      - name: Terraform Dev Format Check
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM DEV FORMAT CHECK ==="
          terraform fmt -check

      - name: Terraform Dev Validate
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM DEV VALIDATE ==="
          terraform validate

      # Step 2: Terraform Stage 1 Apply (Base Infrastructure: ECR, IAM, S3, CloudWatch)
      - name: Terraform Apply (Stage 1 - Base Infrastructure)
        run: |
          set -euo pipefail
          echo "=== TERRAFORM APPLY STAGE 1 (ECR, IAM, S3, CloudWatch) ==="

          LOCK_TABLE="rolex-price-api-tf-locks-dev"
          REGION="us-east-1"
          MAX_RETRIES=3
          ATTEMPT=1

          until [ $ATTEMPT -gt $MAX_RETRIES ]; do
            echo "Executing stage 1 apply (Attempt $ATTEMPT/$MAX_RETRIES)..."
            if terraform apply -var="enable_app_services=false" -auto-approve -no-color; then
              echo "Stage 1 apply succeeded."
              break
            else
              echo "Stage 1 apply failed on attempt $ATTEMPT."
              STALE_LOCK_ID=$(aws dynamodb scan --table-name "$LOCK_TABLE" --region "$REGION" --query "Items[0].LockID.S" --output text 2>/dev/null || true)
              if [ -n "$STALE_LOCK_ID" ] && [ "$STALE_LOCK_ID" != "None" ] && [ "$STALE_LOCK_ID" != "null" ]; then
                echo "Found active state lock ID in DynamoDB: $STALE_LOCK_ID. Attempting force-unlock..."
                terraform force-unlock -force "$STALE_LOCK_ID" || true
              fi

              if [ $ATTEMPT -eq $MAX_RETRIES ]; then
                echo "ERROR: Stage 1 apply failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Waiting 10 seconds before retrying..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      # Step 3 & 4: Log in to ECR, Build Docker image & Push to ECR (:latest)
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "Building Docker image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -f ../../../Dockerfile ../../../

      - name: Push Docker Image to ECR
        run: |
          set -euo pipefail
          echo "Pushing Docker image to ECR..."
          docker push "${{ env.IMAGE_URI }}"

      # Step 5: Run Local Container Smoke Tests
      - name: Run Local Container Smoke Tests
        run: |
          set -euo pipefail
          echo "Starting Docker container locally for health & endpoint verification..."
          docker run -d --name rolex-api-test -p 8000:8000 "${{ env.IMAGE_URI }}"

          echo "Waiting for container application startup..."
          MAX_RETRIES=15
          COUNT=0
          until curl -s -f http://localhost:8000/health > /dev/null || [ $COUNT -eq $MAX_RETRIES ]; do
            echo "Waiting for service to respond on port 8000... ($COUNT/$MAX_RETRIES)"
            sleep 2
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "ERROR: Container failed to start or respond to /health in time."
            docker logs rolex-api-test
            docker stop rolex-api-test && docker rm rolex-api-test
            exit 1
          fi

          echo "Executing local endpoint validation tests with body verification..."
          FAILED=0
          test_local() {
            ENDPOINT="$1"
            CHECK_TYPE="$2"
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" "http://localhost:8000${ENDPOINT}")
            echo -n "Testing local GET ${ENDPOINT} ... "
            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "FAILED (Got HTTP $HTTP_CODE)"
              cat /tmp/resp.json
              echo ""
              FAILED=$((FAILED + 1))
              return
            fi

            VALID=$(python3 -c "import sys, json
try:
    data = json.load(open('/tmp/resp.json'))
    check = '${CHECK_TYPE}'
    if check == 'health' and data.get('status') == 'healthy' and data.get('watches_loaded', 0) > 0:
        print('OK')
    elif check == 'watches' and data.get('total', 0) > 0 and len(data.get('items', [])) > 0:
        print('OK')
    elif check == 'collections' and data.get('total_collections', 0) > 0 and len(data.get('collections', [])) > 0:
        print('OK')
    elif check == 'statistics' and data.get('total_watches', 0) > 0 and 'price_stats' in data:
        print('OK')
    else:
        print('INVALID')
except Exception as e:
    print('ERROR:', e)")
            if [ "$VALID" = "OK" ]; then
              echo "SUCCESS (HTTP 200, valid response body)"
            else
              echo "FAILED (Response body validation failed: $VALID)"
              cat /tmp/resp.json
              echo ""
              FAILED=$((FAILED + 1))
            fi
          }

          test_local "/health" "health"
          test_local "/watches" "watches"
          test_local "/collections" "collections"
          test_local "/statistics" "statistics"

          docker stop rolex-api-test && docker rm rolex-api-test

          if [ $FAILED -ne 0 ]; then
            echo "ERROR: $FAILED local endpoint test(s) failed."
            exit 1
          fi

      # Step 6: Terraform Stage 2 Apply (Create/Update Lambda & API Gateway using existing image)
      - name: Terraform Apply (Stage 2 - Lambda & API Gateway)
        run: |
          set -euo pipefail
          echo "=== TERRAFORM APPLY STAGE 2 (Lambda & API Gateway) ==="

          LOCK_TABLE="rolex-price-api-tf-locks-dev"
          REGION="us-east-1"
          MAX_RETRIES=3
          ATTEMPT=1

          until [ $ATTEMPT -gt $MAX_RETRIES ]; do
            echo "Executing stage 2 apply (Attempt $ATTEMPT/$MAX_RETRIES)..."
            if terraform apply -var="enable_app_services=true" -auto-approve -no-color; then
              echo "Stage 2 apply succeeded."
              break
            else
              echo "Stage 2 apply failed on attempt $ATTEMPT."
              STALE_LOCK_ID=$(aws dynamodb scan --table-name "$LOCK_TABLE" --region "$REGION" --query "Items[0].LockID.S" --output text 2>/dev/null || true)
              if [ -n "$STALE_LOCK_ID" ] && [ "$STALE_LOCK_ID" != "None" ] && [ "$STALE_LOCK_ID" != "null" ]; then
                echo "Found active state lock ID in DynamoDB: $STALE_LOCK_ID. Attempting force-unlock..."
                terraform force-unlock -force "$STALE_LOCK_ID" || true
              fi

              if [ $ATTEMPT -eq $MAX_RETRIES ]; then
                echo "ERROR: Stage 2 apply failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Waiting 10 seconds before retrying..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Print Terraform Outputs
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM OUTPUTS ==="
          terraform output

      # Step 6.5: Direct Lambda Invocation Validation
      - name: Validate Lambda Function Directly
        run: |
          set -euo pipefail
          echo "=== DIRECT LAMBDA INVOCATION VALIDATION ==="
          FUNCTION_NAME="rolex-price-api-dev-app"

          echo "Checking Lambda function state..."
          STATE=$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query "State" --output text)
          echo "Lambda Function State: $STATE"

          echo "Invoking Lambda directly with health check event..."
          PAYLOAD='{"rawPath":"/health","requestContext":{"http":{"method":"GET"}}}'
          aws lambda invoke --function-name "$FUNCTION_NAME" --payload "$PAYLOAD" --cli-binary-format raw-in-base64-out /tmp/lambda_resp.json

          cat /tmp/lambda_resp.json
          echo ""

          python3 -c "
          import json
          data = json.load(open('/tmp/lambda_resp.json'))
          assert data.get('statusCode') == 200, f'Expected statusCode 200, got {data.get(\"statusCode\")}'
          body = json.loads(data.get('body', '{}')) if isinstance(data.get('body'), str) else data.get('body', {})
          assert body.get('status') == 'healthy', f'Expected status healthy, got {body.get(\"status\")}'
          print('Direct Lambda invocation validation passed successfully.')
          "

      # Step 7: Run Cloud Smoke Tests against API Gateway
      - name: Run Cloud Smoke Tests
        run: |
          set -euo pipefail
          echo "=== STARTING CLOUD SMOKE TESTS ==="
          API_ENDPOINT=$(terraform output -raw api_gateway_endpoint)
          echo "Target API Gateway Endpoint: $API_ENDPOINT"

          echo "Polling API Gateway endpoints with retries (up to 120s timeout)..."

          test_cloud_with_retry() {
            ENDPOINT="$1"
            CHECK_TYPE="$2"
            URL="${API_ENDPOINT}${ENDPOINT}"
            echo "Testing GET ${URL} ... "

            MAX_TIME=120
            START_TIME=$(date +%s)
            SUCCESS=0

            while [ $(($(date +%s) - START_TIME)) -lt $MAX_TIME ]; do
              HTTP_CODE=$(curl -s -o /tmp/cloud_resp.json -w "%{http_code}" "$URL" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                VALID=$(python3 -c "import sys, json
try:
    data = json.load(open('/tmp/cloud_resp.json'))
    check = '${CHECK_TYPE}'
    if check == 'health' and data.get('status') == 'healthy' and data.get('watches_loaded', 0) > 0:
        print('OK')
    elif check == 'watches' and data.get('total', 0) > 0 and len(data.get('items', [])) > 0:
        print('OK')
    elif check == 'collections' and data.get('total_collections', 0) > 0 and len(data.get('collections', [])) > 0:
        print('OK')
    elif check == 'statistics' and data.get('total_watches', 0) > 0 and 'price_stats' in data:
        print('OK')
    else:
        print('INVALID')
except Exception as e:
    print('ERROR:', e)")
                if [ "$VALID" = "OK" ]; then
                  echo "  SUCCESS (HTTP 200, valid body)"
                  head -n 5 /tmp/cloud_resp.json
                  echo ""
                  SUCCESS=1
                  break
                else
                  echo "  [$(($(date +%s) - START_TIME))s] Failure: HTTP 200 received but response body validation failed ($VALID)"
                fi
              else
                echo "  [$(($(date +%s) - START_TIME))s] Failure: Got HTTP $HTTP_CODE"
              fi
              sleep 5
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "ERROR: Cloud smoke test failed for ${ENDPOINT} after 120 seconds."
              if [ -f /tmp/cloud_resp.json ]; then
                echo "Last response body:"
                cat /tmp/cloud_resp.json
                echo ""
              fi
              exit 1
            fi
          }

          test_cloud_with_retry "/health" "health"
          test_cloud_with_retry "/watches" "watches"
          test_cloud_with_retry "/collections" "collections"
          test_cloud_with_retry "/statistics" "statistics"

          echo "All cloud smoke tests passed successfully."

      - name: Diagnostic Information on Failure
        if: failure()
        run: |
          set -x
          echo "=========================================="
          echo "DIAGNOSTIC DUMP (WORKFLOW FAILURE DETECTED)"
          echo "=========================================="
          echo "=== TERRAFORM VERSION ==="
          terraform version || true
          echo "=== TERRAFORM STATE LIST ==="
          terraform state list || true
          echo "=== TERRAFORM OUTPUTS ==="
          terraform output || true
          echo "=== AWS CALLER IDENTITY ==="
          aws sts get-caller-identity || true
          echo "=========================================="
