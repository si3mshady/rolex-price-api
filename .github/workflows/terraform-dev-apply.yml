name: Terraform Dev Apply

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-dev-apply:
    name: Terraform Dev Apply & Cloud Smoke Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916923735465:role/OIDC_SAAS
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init -backend-config=backend.tfvars

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Run Cloud Smoke Tests
        run: |
          API_ENDPOINT=$(terraform output -raw api_gateway_endpoint)
          echo "Target API Gateway Endpoint: $API_ENDPOINT"

          echo "Waiting for API Gateway and Lambda deployment readiness..."
          sleep 5

          test_endpoint() {
            ENDPOINT="$1"
            URL="${API_ENDPOINT}${ENDPOINT}"
            echo -n "Testing GET ${URL} ... "
            HTTP_CODE=$(curl -s -o /tmp/cloud_resp.json -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "SUCCESS (HTTP 200)"
              head -n 5 /tmp/cloud_resp.json || true
              echo ""
            else
              echo "FAILED (HTTP $HTTP_CODE)"
              cat /tmp/cloud_resp.json || true
              echo ""
              exit 1
            fi
          }

          test_endpoint "/health"
          test_endpoint "/watches"
          test_endpoint "/collections"
          test_endpoint "/statistics"

          echo "All cloud smoke tests passed successfully (HTTP 200)."
