name: Terraform Dev Apply

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-dev-apply:
    name: Terraform Dev Apply & Cloud Smoke Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::916923735465:role/OIDC_SAAS
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Print Terraform Version
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM VERSION ==="
          terraform version

      - name: Terraform Init
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM INIT ==="
          terraform init -backend-config=backend.tfvars

      - name: Terraform Format Check
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM FORMAT CHECK ==="
          terraform fmt -check

      - name: Terraform Validate
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM VALIDATE ==="
          terraform validate

      - name: Terraform Plan
        run: |
          set -euo pipefail
          echo "=== TERRAFORM PLAN ==="

          LOCK_TABLE="rolex-price-api-tf-locks-dev"
          REGION="us-east-1"
          MAX_RETRIES=3
          ATTEMPT=1

          until [ $ATTEMPT -gt $MAX_RETRIES ]; do
            echo "Executing terraform plan (Attempt $ATTEMPT/$MAX_RETRIES)..."
            if terraform plan -no-color; then
              echo "Terraform plan succeeded."
              break
            else
              echo "Terraform plan failed on attempt $ATTEMPT."
              STALE_LOCK_ID=$(aws dynamodb scan --table-name "$LOCK_TABLE" --region "$REGION" --query "Items[0].LockID.S" --output text 2>/dev/null || true)
              if [ -n "$STALE_LOCK_ID" ] && [ "$STALE_LOCK_ID" != "None" ] && [ "$STALE_LOCK_ID" != "null" ]; then
                echo "Found active state lock ID in DynamoDB: $STALE_LOCK_ID. Attempting force-unlock..."
                terraform force-unlock -force "$STALE_LOCK_ID" || true
              fi

              if [ $ATTEMPT -eq $MAX_RETRIES ]; then
                echo "ERROR: Terraform plan failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Waiting 10 seconds before retrying..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Terraform Apply
        run: |
          set -euo pipefail
          echo "=== TERRAFORM APPLY ==="

          LOCK_TABLE="rolex-price-api-tf-locks-dev"
          REGION="us-east-1"
          MAX_RETRIES=3
          ATTEMPT=1

          until [ $ATTEMPT -gt $MAX_RETRIES ]; do
            echo "Executing terraform apply (Attempt $ATTEMPT/$MAX_RETRIES)..."
            if terraform apply -auto-approve -no-color; then
              echo "Terraform apply succeeded."
              break
            else
              echo "Terraform apply failed on attempt $ATTEMPT."
              STALE_LOCK_ID=$(aws dynamodb scan --table-name "$LOCK_TABLE" --region "$REGION" --query "Items[0].LockID.S" --output text 2>/dev/null || true)
              if [ -n "$STALE_LOCK_ID" ] && [ "$STALE_LOCK_ID" != "None" ] && [ "$STALE_LOCK_ID" != "null" ]; then
                echo "Found active state lock ID in DynamoDB: $STALE_LOCK_ID. Attempting force-unlock..."
                terraform force-unlock -force "$STALE_LOCK_ID" || true
              fi

              if [ $ATTEMPT -eq $MAX_RETRIES ]; then
                echo "ERROR: Terraform apply failed after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Waiting 10 seconds before retrying..."
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

      - name: Print Terraform Outputs
        run: |
          set -euxo pipefail
          echo "=== TERRAFORM OUTPUTS ==="
          terraform output

      - name: Run Cloud Smoke Tests
        run: |
          set -euxo pipefail
          echo "=== STARTING CLOUD SMOKE TESTS ==="
          API_ENDPOINT=$(terraform output -raw api_gateway_endpoint)
          echo "Target API Gateway Endpoint: $API_ENDPOINT"

          echo "Waiting for API Gateway and Lambda deployment readiness..."
          sleep 5

          test_endpoint() {
            ENDPOINT="$1"
            URL="${API_ENDPOINT}${ENDPOINT}"
            echo "Testing GET ${URL} ... "
            HTTP_CODE=$(curl -s -o /tmp/cloud_resp.json -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "SUCCESS (HTTP 200)"
              head -n 5 /tmp/cloud_resp.json
              echo ""
            else
              echo "FAILED (HTTP $HTTP_CODE)"
              cat /tmp/cloud_resp.json
              echo ""
              exit 1
            fi
          }

          test_endpoint "/health"
          test_endpoint "/watches"
          test_endpoint "/collections"
          test_endpoint "/statistics"

          echo "All cloud smoke tests passed successfully (HTTP 200)."

      - name: Diagnostic Information on Failure
        if: failure()
        run: |
          set -x
          echo "=========================================="
          echo "DIAGNOSTIC DUMP (WORKFLOW FAILURE DETECTED)"
          echo "=========================================="
          echo "=== TERRAFORM VERSION ==="
          terraform version || true
          echo "=== TERRAFORM STATE LIST ==="
          terraform state list || true
          echo "=== TERRAFORM OUTPUTS ==="
          terraform output || true
          echo "=== AWS CALLER IDENTITY ==="
          aws sts get-caller-identity || true
          echo "=========================================="
